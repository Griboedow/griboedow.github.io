name: Publish research notes

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

concurrency:
  group: research-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare the published source revisions
        id: compare
        shell: bash
        run: |
          changed=true
          if [[ "$GITHUB_EVENT_NAME" == schedule ]] && curl -fsSL --retry 2 https://griboedow.github.io/publication.json -o "$RUNNER_TEMP/published.json"; then
            if node publisher/unchanged.mjs "$RUNNER_TEMP/published.json"; then changed=false; fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - if: steps.compare.outputs.changed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - if: steps.compare.outputs.changed == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - if: steps.compare.outputs.changed == 'true'
        name: Build and check all research pages
        run: |
          npm ci --no-audit --no-fund
          python -m pip install Pillow==13.0.0
          npm run build
          node publisher/check.mjs
      - if: steps.compare.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
